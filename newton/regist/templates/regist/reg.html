{% extends 'regist/layout.html' %}
{% load static %}
{% block title %}Регистрация{% endblock %}
{% block linkcss %}<link rel="stylesheet" href="{% static 'css/style.css' %}">{% endblock %}

{% block content %}

<div class="welcome_text">
    Welcome to Newton
</div>
<ul class="regist_block">

    <li class="reg_li"><label for="name_log" class="signature">Имя</label></li>
    <li class="reg_li"><input type="text" class="input_data" name="name" id="name_log" placeholder="Иван"></li>

    <li class="reg_li"><label for="" class="signature">Фамилия</label></li>
    <li class="reg_li"><input type="text" class="input_data" name="surname" id="surname_log" placeholder="Иванов"></li>

    <li class="reg_li"><label for="" class="signature">Дата рождения</label></li>
    <li class="reg_li"><input type="date" class="input_data" name="birthday" id="birthday_log" placeholder="31.01.24"></li>

    <li class="reg_li"><label for="" class="signature">Логин</label></li>
    <li class="reg_li"><input type="text" class="input_data" name="login" id="log_in" placeholder="email или телефон"></li>

    <li class="reg_li"><label for="" class="signature">Пароль</label></li>
    <li class="reg_li"><input type="password" name="password" id="passwd" placeholder="пароль"></li>

    <button class="send" type="submit">Зарегестрироваться</button>
</ul>



{% endblock %}
